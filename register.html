<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register-TechCon 2026</title>
</head>
<body>
    <header>
        <h1>Register for TechCon 2026</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="schedule.html">Schedule</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h2>Attendee Registration Form</h2>
        <p>Register today to attend TechCon 2026!</p>
        <form action="submit_registration" method="post">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required><br><br>

            <label for="terms">Terms and Conditions:</label>
            <input type="checkbox" id="terms" name="terms" required><br><br>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">
                I agree to the terms and conditions
            </label>
            <br><br>

            <button type="submit">Register</button>
            </form>
            </main>
            <footer>
        <p>copyright &copy; 2026 TechCon conference. All rights reserved.</p>
         
    </footer>
    
</body>
</html>
